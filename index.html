<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuzzy</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #000 transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #000; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #1c1c1c; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #161616; color: #e7e7e7; display: flex; height: 100vh; overflow: hidden;
    }
    button, .btn, .nav-item, .tab, .stab, .action, .c-like, .c-reply, .c-del, .follow-btn,
    .post-btn, .back-btn, .list-row, .msg-convo, .notif-item, .stat-link, .pfp-opt,
    .emoji-opt, .messages, .user, .del-chat, .status-opt, .cancel, .p-name, .l-name, .c-name {
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease,
                  transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    button:active, .action:active, .c-like:active, .c-del:active,
    .follow-btn:active, .post-btn:active, .back-btn:active, .status-opt:active,
    .pfp-opt:active, .emoji-opt:active { transform: scale(0.95); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
    .btn-ghost:hover { transform: translateY(-1px); }

    .sidebar {
      width: 280px; flex-shrink: 0; background: #161616;
      border-right: 1px solid #2f2f2f; padding: 16px 12px; display: flex; flex-direction: column;
    }
    .logo {
      width: 130px; margin: 0 8px 16px; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
    }
    .logo:hover { transform: scale(1.12) rotate(-6deg); filter: drop-shadow(0 0 14px rgba(255, 200, 60, 0.55)) brightness(1.05); }
    .nav-item { display: flex; align-items: center; gap: 18px; font-size: 22px; padding: 8px 12px; border-radius: 9999px; cursor: pointer; color: #9a9a9a; }
    .nav-item:hover { background: #1d1d1d; color: #e7e7e7; }
    .nav-item.active { color: #e7e7e7; }
    .nav-item img { width: 30px; height: 30px; object-fit: contain; }
    .mobile-msg { display: none; }
    .notif-badge {
      margin-left: auto; display: none; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 9999px;
      background: #f91818; color: #fff; font-size: 13px; font-weight: 700; line-height: 1;
    }
    .post-btn { margin: 14px 12px; background: #e7e7e7; color: #000; font-size: 20px; font-weight: 500; text-align: center; padding: 11px 0; border-radius: 9999px; cursor: pointer; border: none; }
    .post-btn:hover { background: #d9d9d9; }
    .user { display: flex; align-items: center; gap: 14px; font-size: 24px; padding: 8px 12px; border-radius: 9999px; cursor: pointer; }
    .user:hover { background: #1d1d1d; }
    .avatar { width: 69px; height: 50px; border-radius: 10px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .status-badge {
      position: absolute; bottom: 0; right: 0; width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid #161616; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .status-badge.online { background: #22c55e; }
    .status-badge.offline { background: #717171; }
    .status-badge.sleep { background: #1e3a8a; }
    .status-badge.dnd { background: #ef4444; }
    .status-badge img { width: 10px; height: 10px; }
    .status-badge .dnd-bar { width: 7px; height: 2px; background: #fff; border-radius: 2px; }
    .verified-check { width: 20px; height: 20px; vertical-align: -4px; margin-left: 3px; }
    .logout { margin-left: auto; background: none; border: none; color: #717171; font-size: 16px; cursor: pointer; }
    .logout:hover { color: #f91880; }
    .feed { flex: 1; display: flex; justify-content: center; min-width: 0; }
    .feed-inner { width: 100%; max-width: 700px; border-left: 1px solid #2f2f2f; border-right: 1px solid #2f2f2f; background: #161616; overflow-y: auto; height: 100%; }
    .feed-header { position: sticky; top: 0; z-index: 10; background: rgba(22, 22, 22, 0.9); backdrop-filter: blur(8px); display: flex; justify-content: center; gap: 12px; font-size: 20px; padding: 10px 0; border-bottom: 1px solid #2f2f2f; }
    .tab { cursor: pointer; color: #717171; padding: 4px 10px; border-radius: 8px; }
    .tab.active { color: #fff; background: #2a2a2a; }
    .post { padding: 12px 16px; border-bottom: 1px solid #2f2f2f; }
    .post-head { display: flex; align-items: center; gap: 12px; font-size: 18px; margin-bottom: 8px; }
    .post-head .avatar { width: 44px; height: 44px; }
    .post-head .time { color: #717171; }
    .p-name { cursor: pointer; color: #fff; }
    .p-name:hover { text-decoration: underline; }
    .post-body { font-size: 18px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .post-actions { display: flex; gap: 28px; margin-top: 8px; }
    .action { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #717171; font-size: 18px; cursor: pointer; }
    .action img { width: 24px; height: 24px; transition: transform 0.1s; }
    .action:hover img { transform: scale(1.15); }
    .action.like.active { color: #fff; }
    .heart-shape { width: 24px; height: 24px; display: inline-block; }
    .heart-shape svg { width: 100%; height: 100%; display: block; }
    .action .heart-shape svg { fill: #717171; transition: fill 0.18s ease; }
    .action.like.active .heart-shape svg { fill: rgb(218, 51, 51); }
    .c-like .heart-shape { width: 16px; height: 16px; }
    .c-like .heart-shape svg { fill: #717171; transition: fill 0.18s ease; }
    .c-like.active .heart-shape svg { fill: rgb(218, 51, 51); }
    .action.like:not(.active) img { filter: grayscale(1) brightness(1.6); }
    .action.like.active img { filter: none; }
    @keyframes heartPop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
    .action.like.active img, .c-like.active img { animation: heartPop 0.35s ease; }
    .comments { margin-top: 8px; }
    .comment-row { display: flex; gap: 10px; align-items: center; }
    .comment-row input { flex: 1; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 9999px; padding: 10px 16px; color: #e7e7e7; font-size: 15px; outline: none; }
    .comment-row input:focus { border-color: #555; }
    .comment-item { display: flex; gap: 10px; padding: 8px 0; }
    .comment-item.nested { padding-top: 4px; padding-bottom: 4px; }
    .comment-item .avatar { width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
    .c-body { flex: 1; }
    .c-head { font-size: 14px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .c-head b { color: #fff; cursor: pointer; }
    .c-head b:hover { text-decoration: underline; }
    .c-head .time { color: #717171; margin-left: 6px; }
    .c-head .verified-check { width: 14px; height: 14px; vertical-align: -3px; }
    .c-text { font-size: 15px; color: #c9c9c9; margin-top: 2px; word-break: break-word; }
    .c-actions { display: flex; gap: 14px; margin-top: 4px; align-items: center; }
    .c-like { background: none; border: none; color: #717171; font-size: 13px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
    .c-like img { width: 16px; height: 16px; filter: grayscale(1) brightness(1.6); }
    .c-like.active { color: #fff; }
    .c-reply { background: none; border: none; color: #717171; font-size: 13px; cursor: pointer; }
    .c-reply:hover { color: #fff; }
    .c-del { background: none; border: none; color: #717171; font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .c-del:hover { color: #ff4800; background: #2a2a2a; }
    .reply-chip { display: none; align-items: center; gap: 6px; font-size: 13px; color: #717171; margin-bottom: 8px; }
    .reply-chip b { color: #fff; }
    .reply-chip .cancel { cursor: pointer; color: #717171; }
    .reply-chip .cancel:hover { color: #ff0000; }
    .empty { padding: 24px 20px; text-align: center; color: #717171; font-size: 18px; }
    #profileView, #searchView, #messagesView, #notificationsView { display: none; }
    .profile-head { padding: 14px 16px; border-bottom: 1px solid #2f2f2f; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: #e7e7e7; font-size: 16px; cursor: pointer; margin-bottom: 12px; padding: 6px 10px; border-radius: 9999px; }
    .back-btn:hover { background: #1d1d1d; }
    .profile-top { display: flex; gap: 20px; align-items: flex-start; }
    .profile-top .avatar { width: 96px; height: 96px; }
    .profile-top .status-badge { width: 22px; height: 22px; }
    .profile-top .status-badge img { width: 14px; height: 14px; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 24px; font-weight: 700; }
    .profile-handle { color: #717171; font-size: 16px; }
    .profile-bio { margin-top: 10px; font-size: 16px; line-height: 1.4; white-space: pre-wrap; }
    .profile-stats { display: flex; gap: 12px; margin-top: 12px; font-size: 16px; }
    .stat-link { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 9999px; }
    .stat-link:hover { background: #1d1d1d; }
    .stat-link b { color: #fff; }
    .stat-link span { color: #717171; }
    .follow-btn { background: #e7e7e7; color: #000; border: none; border-radius: 9999px; padding: 8px 20px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .follow-btn:hover { background: #d9d9d9; }
    .follow-btn.following { background: none; border: 1px solid #555; color: #e7e7e7; }
    .follow-btn.following:hover { border-color: #ff0000; color: #ff4800; }
    .change-bio-btn { background: none; border: 3px solid #555; color: #e7e7e7; border-radius: 9999px; padding: 8px 20px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .change-bio-btn:hover { border-color: #e7e7e7; }
    .bio-edit { margin-top: 14px; display: none; }
    .bio-edit.open { display: block; }
    .bio-edit textarea { width: 100%; height: 80px; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 12px; padding: 10px; color: #e7e7e7; font-size: 15px; resize: none; outline: none; font-family: inherit; }
    .bio-edit textarea:focus { border-color: #555; }
    .bio-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .status-picker { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .status-label { font-size: 14px; color: #717171; }
    .status-opt { background: #2a2a2a; border: 1px solid #2f2f2f; color: #e7e7e7; border-radius: 9999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
    .status-opt:hover { background: #333; }
    .status-opt.active { border-color: #22c55e; color: #fff; }
    .search-box { position: sticky; top: 0; z-index: 10; background: rgba(22, 22, 22, 0.9); backdrop-filter: blur(8px); padding: 12px 16px; border-bottom: 1px solid #2f2f2f; }
    .search-box input { width: 100%; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 9999px; padding: 12px 20px; color: #e7e7e7; font-size: 16px; outline: none; }
    .search-box input:focus { border-color: #555; }
    .search-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .stab { cursor: pointer; color: #717171; padding: 6px 16px; border-radius: 9999px; font-size: 15px; }
    .stab.active { background: #2a2a2a; color: #fff; }
    .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #2f2f2f; cursor: pointer; }
    .list-row:hover { background: #1d1d1d; }
    .list-row .avatar { width: 44px; height: 44px; }
    .list-row .l-name { font-size: 18px; color: #fff; }
    .list-row:hover .l-name { text-decoration: underline; }
    .list-row .l-handle { color: #717171; font-size: 14px; }
    .list-row .follow-btn { margin-top: 0; margin-left: auto; padding: 6px 16px; font-size: 14px; }
    .notif-item { display: flex; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #2f2f2f; cursor: pointer; align-items: center; }
    .notif-item:hover { background: #1d1d1d; }
    .notif-item .avatar { width: 44px; height: 44px; }
    .notif-item .n-body { flex: 1; }
    .notif-item .n-text { font-size: 16px; }
    .notif-item .n-time { font-size: 13px; color: #717171; margin-top: 2px; }
    .notif-item.unread { background: #1d1d1d; }
    .notif-item.unread .n-text { font-weight: 600; }
    .msg-convo { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #2f2f2f; cursor: pointer; }
    .msg-convo:hover { background: #1d1d1d; }
    .msg-convo .avatar { width: 44px; height: 44px; }
    .msg-convo .m-name { font-size: 18px; }
    #msgListWrap { height: 100%; overflow-y: auto; }
    #chatWrap { display: none; flex-direction: column; height: 100%; }
    #chatWrap.open { display: flex; }
    .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2f2f2f; background: rgba(22, 22, 22, 0.9); backdrop-filter: blur(8px); }
    .chat-head .avatar { width: 40px; height: 40px; cursor: pointer; }
    .chat-head .c-name { font-size: 18px; font-weight: 600; cursor: pointer; }
    .chat-head .c-name:hover { text-decoration: underline; }
    .chat-head .back-btn { margin-bottom: 0; }
    .chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; flex-direction: column; max-width: 75%; }
    .msg-wrap.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.them { align-self: flex-start; align-items: flex-start; }
    .chat-msg { padding: 10px 14px; border-radius: 16px; font-size: 16px; line-height: 1.4; word-break: break-word; }
    .chat-msg.me { background: #2f2f2f; border-bottom-right-radius: 4px; }
    .chat-msg.them { background: #1d1d1d; border: 1px solid #2f2f2f; border-bottom-left-radius: 4px; }
    .msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: #9a9a9a; }
    .msg-time { color: #9a9a9a; }
    .msg-ticks { font-size: 13px; letter-spacing: -1px; color: #9a9a9a; line-height: 1; }
    .msg-ticks.read { color: #3b82f6; }
    .msg-del { background: none; border: none; color: #717171; font-size: 12px; cursor: pointer; padding: 0 4px; border-radius: 4px; }
    .msg-del:hover { color: #ff4800; background: #2a2a2a; }
    .chat-input { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid #2f2f2f; background: #161616; }
    .chat-input input { flex: 1; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 9999px; padding: 10px 16px; color: #e7e7e7; font-size: 15px; outline: none; }
    .chat-input input:focus { border-color: #555; }
    .right { width: 400px; flex-shrink: 0; background: #161616; border-left: 1px solid #2f2f2f; padding: 16px; }
    .messages { display: flex; align-items: center; gap: 14px; background: #1d1d1d; border-radius: 9999px; padding: 14px 20px; font-size: 20px; cursor: pointer; }
    .messages:hover { background: #2a2a2a; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #1d1d1d; border: 1px solid #2f2f2f; border-radius: 16px; width: 480px; max-width: 92%; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .modal h3 { margin-bottom: 14px; font-size: 20px; }
    .modal textarea { width: 100%; height: 120px; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 12px; padding: 12px; color: #e7e7e7; font-size: 16px; resize: none; outline: none; font-family: inherit; }
    .modal textarea:focus { border-color: #555; }
    .auth-input { width: 100%; background: #0d0d0d; border: 1px solid #2f2f2f; border-radius: 12px; padding: 12px; color: #e7e7e7; font-size: 16px; outline: none; margin-bottom: 10px; font-family: inherit; }
    .auth-input:focus { border-color: #555; }
    .auth-error { color: #f91880; font-size: 14px; margin-top: 10px; min-height: 18px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .btn { border: none; border-radius: 9999px; padding: 10px 22px; font-size: 16px; cursor: pointer; }
    .btn-primary { background: #e7e7e7; color: #000; font-weight: 600; }
    .btn-primary:hover { background: #d9d9d9; }
    .btn-danger { background: #f91818; color: #fff; font-weight: 600; }
    .btn-danger:hover { background: #d91212; }
    .btn-ghost { background: none; color: #9a9a9a; }
    .btn-ghost:hover { color: #fff; }
    .confirm-modal { width: 380px; text-align: center; }
    .confirm-modal h3 { font-size: 22px; margin-bottom: 8px; }
    .confirm-msg { color: #9a9a9a; font-size: 15px; line-height: 1.4; margin-bottom: 4px; }
    #toasts { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transform: translateX(20px); transition: all 0.3s ease; }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.error { background: #3a1a2a; border-color: #f97218; color: #ca890f; }
    .tw-emoji { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -0.25em; }
    .fuzzed-modal { text-align: center; }
    .fuzzed-modal h3 { font-size: 30px; margin-bottom: 20px; }
    .pfp-section-label { font-size: 14px; color: #717171; margin-bottom: 8px; }
    .pfp-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .pfp-opt { width: 72px; height: 72px; border-radius: 12px; background: #2a2a2a; border: 2px solid #2f2f2f; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0; }
    .pfp-opt img { width: 100%; height: 100%; object-fit: cover; }
    .pfp-opt.selected { border-color: #f96a18; }
    .pfp-opt.pfp-clear { width: 72px; height: 72px; border-radius: 12px; background: #161616; border: 2px solid #2f2f2f; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #717171; font-size: 12px; }
    .pfp-opt.pfp-clear:hover { border-color: #f96a18; color: #f94c18; }
    .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-height: 220px; overflow-y: auto; padding: 4px; }
    .emoji-opt { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .emoji-opt:hover { background: #2a2a2a; }
    .emoji-opt.selected { background: #2a2a2a; outline: 2px solid #ec8106; }
    .emoji-opt img { width: 28px; height: 28px; }
    @media (max-width: 768px) {
      .right { display: none; }
      .mobile-msg { display: flex; }
      .sidebar {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto;
        width: 100%; height: 64px; padding: 6px;
        flex-direction: row; align-items: center; justify-content: space-around;
        border-right: none; border-top: 1px solid #2f2f2f; z-index: 50;
      }
      .logo { display: none; }
      .nav-item { position: relative; flex-direction: column; gap: 2px; font-size: 10px; padding: 4px 8px; }
      .nav-item img { width: 24px; height: 24px; }
      .notif-badge { position: absolute; top: -2px; right: -2px; margin: 0; min-width: 16px; height: 16px; font-size: 10px; padding: 0 4px; }
      .post-btn { margin: 0; padding: 8px 14px; font-size: 14px; }
      .user { gap: 6px; padding: 4px; }
      .user .avatar { width: 36px; height: 36px; }
      .user span { display: none; }
      .user:not(:has(.logout)) span { display: inline; font-size: 12px; color: #e7e7e7; }
      .logout { font-size: 10px; }
      .feed { padding-bottom: 64px; }
      .feed-inner { border-left: none; border-right: none; max-width: 100%; }
      .feed-header { font-size: 16px; padding: 8px 0; }
      .post { padding: 12px; }
      .post-actions { gap: 24px; }
      .profile-top { gap: 14px; }
      .profile-top .avatar { width: 72px; height: 72px; }
      .profile-head { padding: 12px; }
      .modal { width: 92%; }
      .msg-wrap { max-width: 85%; }
      .chat-body { padding: 10px; }
      .chat-input { padding: 8px 10px; }
      .chat-input input { padding: 10px 14px; font-size: 16px; }
      .emoji-grid { grid-template-columns: repeat(6, 1fr); }
      .status-picker { gap: 6px; }
      .status-opt { padding: 5px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <img class="logo" src="Fuzzy.png" alt="Fuzzy logo" />
    <div class="nav-item active" data-nav="home"><img src="Home.png" alt="" /> home</div>
    <div class="nav-item" data-nav="search"><img src="search.png" alt="" /> search</div>
    <div class="nav-item" data-nav="account"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/72x72/1f464.png" alt="" /> account</div>
    <div class="nav-item" data-nav="notifications"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/72x72/1f514.png" alt="" /> notifications <span class="notif-badge" id="notifBadge"></span></div>
    <div class="nav-item mobile-msg" data-nav="messages"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/72x72/1f4e7.png" alt="" /> messages</div>
    <button class="post-btn" id="openPost">post</button>
    <div class="user" id="userRow">
      <div class="avatar" id="myAvatar"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/72x72/1f642.png" alt="" /></div>
      <span id="userName">sign in</span>
      <button class="logout" id="logoutBtn" style="display:none">log out</button>
    </div>
  </aside>

  <main class="feed">
    <div class="feed-inner" id="feedView">
      <div class="feed-header">
        <span class="tab active" data-tab="foryou">for you</span>
        <span class="tab" data-tab="following">following</span>
      </div>
      <div id="postsList"></div>
    </div>

    <div class="feed-inner" id="profileView">
      <div class="profile-head">
        <button class="back-btn" id="backBtn">&larr; back</button>
        <div class="profile-top">
          <div class="avatar" id="profAvatar"><img src="" alt="" /></div>
          <div class="profile-info">
            <div class="profile-name" id="profName"></div>
            <div class="profile-handle" id="profHandle"></div>
            <div class="profile-bio" id="profBio"></div>
            <div class="profile-stats">
              <span class="stat-link" id="statFollowing"><b id="profFollowing">0</b> <span>following</span></span>
              <span class="stat-link" id="statFollowers"><b id="profFollowers">0</b> <span>followers</span></span>
            </div>
            <button class="follow-btn" id="followBtn" style="display:none">Follow</button>
            <button class="change-bio-btn" id="changeBioBtn" style="display:none">Change bio</button>
            <div class="status-picker" id="statusPicker" style="display:none">
              <span class="status-label">status</span>
              <button class="status-opt" data-status="">auto</button>
              <button class="status-opt" data-status="online">online</button>
              <button class="status-opt" data-status="sleep">sleep</button>
              <button class="status-opt" data-status="dnd">dnd</button>
            </div>
            <div class="bio-edit" id="bioEdit">
              <textarea id="bioInput" placeholder="Write a short bio..."></textarea>
              <div class="bio-btns">
                <button class="btn btn-ghost" id="bioCancel">Cancel</button>
                <button class="btn btn-primary" id="bioSave">Save bio</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="profList" style="display:none"></div>
      <div id="profPosts"></div>
    </div>

    <div class="feed-inner" id="searchView">
      <div class="search-box">
        <div class="search-tabs">
          <span class="stab active" data-stab="posts">posts</span>
          <span class="stab" data-stab="accounts">accounts</span>
        </div>
        <input id="searchInput" placeholder="Search..." />
      </div>
      <div id="searchResults"></div>
    </div>

    <div class="feed-inner" id="notificationsView">
      <div class="feed-header"><span class="tab active">Notifications</span></div>
      <div id="notifList"></div>
    </div>

    <div class="feed-inner" id="messagesView" style="overflow:hidden">
      <div id="msgListWrap">
        <div class="feed-header"><span class="tab active">Messages</span></div>
        <div id="msgList"></div>
      </div>
      <div id="chatWrap">
        <div class="chat-head">
          <button class="back-btn" id="chatBack">&larr;</button>
          <div class="avatar" id="chatAvatar"><img src="" alt="" /></div>
          <span class="c-name" id="chatName"></span>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input">
          <input id="chatInput" type="text" placeholder="Start a message..." />
          <button class="btn btn-primary" id="chatSend">Send</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="right">
    <div class="messages" id="messagesBtn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#e7e7e7">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
      Messages
    </div>
  </aside>

  <div class="modal-overlay" id="postModal">
    <div class="modal">
      <h3>Create a post</h3>
      <textarea id="postText" placeholder="What's happening?"></textarea>
      <div class="modal-btns">
        <button class="btn btn-ghost" id="cancelPost">Cancel</button>
        <button class="btn btn-primary" id="submitPost">Post</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h3 id="authTitle">Log in</h3>
      <input class="auth-input" id="authUsername" placeholder="username" />
      <input class="auth-input" id="authPassword" type="password" placeholder="password" />
      <p class="auth-error" id="authError"></p>
      <div class="modal-btns">
        <button class="btn btn-ghost" id="authSwitch">No account? Sign up</button>
        <button class="btn btn-primary" id="authSubmit">Log in</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="fuzzedModal">
    <div class="modal fuzzed-modal">
      <h3>You have been FUZZED!</h3>
      <button class="btn btn-primary" id="fuzzedLogout">log out</button>
    </div>
  </div>

  <div class="modal-overlay" id="pfpModal">
    <div class="modal">
      <h3>Change profile picture</h3>
      <div class="pfp-section-label">Pick an image</div>
      <div class="pfp-grid" id="pfpImages"></div>
      <div class="pfp-section-label" style="margin-top:16px">Or pick an emoji</div>
      <div class="emoji-grid" id="pfpEmojis"></div>
      <div class="modal-btns">
        <button class="btn btn-ghost" id="pfpClose">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal confirm-modal">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p class="confirm-msg" id="confirmMsg"></p>
      <div class="modal-btns" style="justify-content:center">
        <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    function toast(msg, isError) {
      const t = document.createElement("div");
      t.className = "toast" + (isError ? " error" : "");
      t.textContent = msg;
      document.getElementById("toasts").appendChild(t);
      setTimeout(() => t.classList.add("show"), 10);
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 4000);
    }
    function status(msg, isError) { toast(msg, isError); }
    window.onerror = (msg) => toast("ERROR: " + msg, true);

    const TW = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/72x72/";
    const FACES = [
      "1f600","1f601","1f602","1f923","1f605","1f604","1f609","1f60a","1f60b","1f60e",
      "1f60d","1f929","1f618","1f970","1f61c","1f92a","1f607","1f973","1f60f","1f634",
      "1f924","1f62a","1f92f","1f920","1f643","1f62c","1f911","1f636","1f644","1f62e",
      "1f632","1f914","1f917","1f92d","1f92b","1f925","1f633","1f631","1f97a","1f622",
      "1f62d","1f624","1f620","1f621","1f628","1f630","1f61e","1f61f","1f629","1f62b"
    ];
    function randomFace() { return TW + FACES[Math.floor(Math.random() * FACES.length)] + ".png"; }
    function faceForUid(uid) {
      let h = 0;
      const s = String(uid || "");
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return TW + FACES[h % FACES.length] + ".png";
    }
    const HEART_SVG = '<span class="heart-shape"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>';
    const COMMENT = TW + "1f4ac.png";
    const TRASH = TW + "1f5d1.png";
    const DEFAULT_FACE = TW + "1f642.png";
    const WAVE = TW + "1f44b.png";

    const POST_TTL = 24 * 60 * 60 * 1000;

    const VERIFIED = ["matu", "matu67"];
    function verifiedBadge(username) {
      return VERIFIED.includes((username || "").toLowerCase()) ? '<img class="verified-check" src="check.png" alt="verified" />' : "";
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function twEmojiHtml(text) {
      const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      let html = "";
      for (const part of seg.segment(text)) {
        const s = part.segment;
        if (/\p{Extended_Pictographic}|\p{Emoji_Presentation}|\u200d|\ufe0f|\u20e3/u.test(s)) {
          const hex = [...s].map(c => c.codePointAt(0).toString(16)).filter(h => h !== "fe0f").join("-");
          const fallback = s.replace(/'/g, "\\'");
          html += '<img class="tw-emoji" src="' + TW + hex + '.png" alt="" onerror="this.onerror=null;this.outerHTML=\'' + fallback + '\'"/>';
        } else {
          html += escapeHtml(s);
        }
      }
      return html;
    }
    function setEmojiText(el, text) { el.innerHTML = twEmojiHtml(text); }

    const AVATAR_BUST = "?v=" + Date.now();
    function bustAvatarSrc(img) {
      const s = img.getAttribute("src") || "";
      if (/^avatar\d+\.png$/.test(s)) img.src = s + AVATAR_BUST;
    }
    (function bustAvatars() {
      document.querySelectorAll("img").forEach(bustAvatarSrc);
      const mo = new MutationObserver(muts => {
        muts.forEach(m => m.addedNodes.forEach(n => {
          if (!n || n.nodeType !== 1) return;
          if (n.tagName === "IMG") bustAvatarSrc(n);
          else if (n.querySelectorAll) n.querySelectorAll("img").forEach(bustAvatarSrc);
        }));
      });
      mo.observe(document.body, { childList: true, subtree: true });
    })();

    const firebaseConfig = {
      apiKey: "AIzaSyCisYa7HGIqKuBXH3VaywwmdSjcOgGhSyA",
      authDomain: "fuzzy-c18ec.firebaseapp.com",
      projectId: "fuzzy-c18ec",
      storageBucket: "fuzzy-c18ec.firebasestorage.app",
      messagingSenderId: "18220475527",
      appId: "1:18220475527:web:ddcd2af0d27c81ed680422"
    };

    let auth = null, db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      status("Fuzzy fuzz fuzzzzzz.");
    } catch (err) {
      status("Firebase FAILED to load: " + err.message, true);
    }

    let isSignup = false;
    let myUsername = "";
    let myEmoji = DEFAULT_FACE;
    let myBio = "";
    let myStatus = null;
    let activeTab = "foryou";
    let activeView = "feed";
    let lastPosts = [];
    let myFollowing = new Set();
    let myFollowers = new Set();
    let profileUid = null;
    let profListMode = null;
    let activeChatUid = null;
    let chatUnsub = null;
    let commentUnsubs = [];
    let notifUnsub = null;
    let usersUnsub = null;
    let usersSig = "";
    let prevUnreadCount = 0;
    let searchMode = "posts";
    let userNumMap = new Map();
    const userCache = new Map();
    function cacheUser(uid, data) { if (uid && data) userCache.set(uid, data); }

    let currentChatMsgs = [];

    let notifSound = null;
    function playNotifSound() {
      try {
        if (!notifSound) notifSound = new Audio("Notification.mp3");
        notifSound.currentTime = 0;
        notifSound.play().catch(() => {});
      } catch (e) { /* ignore */ }
    }

    function touchLastSeen() {
      if (!auth || !auth.currentUser || !db) return;
      db.collection("users").doc(auth.currentUser.uid)
        .update({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() })
        .catch(() => {});
    }
    setInterval(touchLastSeen, 30000);
    window.addEventListener("pagehide", touchLastSeen);

    function isOnline(uid) {
      const u = userCache.get(uid);
      if (!u) return false;
      if (u.status) return true;
      const ls = u.lastSeen;
      if (!ls) return false;
      return Date.now() - ls.toMillis() < 5 * 60 * 1000;
    }

    function statusBadgeHtml(uid) {
      const u = userCache.get(uid);
      let cls, inner = "";
      if (u && u.status) {
        if (u.status === "sleep") { cls = "sleep"; inner = '<img src="' + TW + '1f319.png" alt="" />'; }
        else if (u.status === "dnd") { cls = "dnd"; inner = '<span class="dnd-bar"></span>'; }
        else { cls = "online"; }
      } else {
        cls = isOnline(uid) ? "online" : "offline";
      }
      return '<span class="status-badge ' + cls + '">' + inner + '</span>';
    }
    function decorateAvatars(root) {
      if (!root) return;
      root.querySelectorAll(".avatar[data-uid]").forEach(av => {
        if (av.querySelector(".status-badge")) return;
        av.insertAdjacentHTML("beforeend", statusBadgeHtml(av.dataset.uid));
      });
    }
    function refreshStatusDots() {
      document.querySelectorAll(".avatar[data-uid] > .status-badge").forEach(b => {
        const uid = b.parentElement.dataset.uid;
        const tmp = document.createElement("span");
        tmp.innerHTML = statusBadgeHtml(uid);
        const nb = tmp.firstChild;
        if (nb) b.replaceWith(nb);
      });
    }

    function setupUsersListener() {
      if (usersUnsub) { usersUnsub(); usersUnsub = null; }
      if (!db) return;
      usersUnsub = db.collection("users").onSnapshot(snap => {
        snap.forEach(d => cacheUser(d.id, d.data()));
        const docs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
        docs.sort((a, b) => {
          const ta = a.data.createdAt ? a.data.createdAt.toMillis() : 0;
          const tb = b.data.createdAt ? b.data.createdAt.toMillis() : 0;
          if (ta !== tb) return ta - tb;
          return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
        });
        const m = new Map();
        docs.forEach((d, i) => m.set(d.id, i + 1));
        userNumMap = m;
        let sig = "";
        snap.forEach(d => {
          const u = d.data();
          sig += d.id + ":" + (u.emoji || "") + ":" + (u.username || "") + ":" + (u.status || "") + ":" + (u.lastSeen ? u.lastSeen.toMillis() : 0) + ";";
        });
        if (sig !== usersSig) {
          usersSig = sig;
          renderPosts();
          if (profileUid) renderProfile();
          if (activeView === "search") renderSearch(document.getElementById("searchInput").value);
          if (activeView === "notifications") renderNotifications();
          if (activeView === "messages") {
            if (chatWrap.classList.contains("open") && activeChatUid) {
              const u = userCache.get(activeChatUid);
              if (u) {
                document.getElementById("chatName").textContent = u.username || "user";
                document.getElementById("chatName").insertAdjacentHTML("beforeend", verifiedBadge(u.username));
                document.querySelector("#chatAvatar img").src = u.emoji || faceForUid(u.id);
              }
            } else renderConversations();
          }
        }
        refreshStatusDots();
        if (activeView === "messages" && chatWrap.classList.contains("open")) updateChatTicks();
        if (auth && auth.currentUser) {
          const me = userCache.get(auth.currentUser.uid);
          if (me) {
            if (me.emoji) myEmoji = me.emoji;
            if (me.username) myUsername = me.username;
            if (me.bio !== undefined) myBio = me.bio;
            myStatus = me.status || null;
          }
        }
        updateSidebar();
      }, () => {});
    }

    const authModal = document.getElementById("authModal");
    const authError = document.getElementById("authError");
    const fuzzedModal = document.getElementById("fuzzedModal");
    const postsList = document.getElementById("postsList");
    const feedView = document.getElementById("feedView");
    const profileView = document.getElementById("profileView");
    const searchView = document.getElementById("searchView");
    const messagesView = document.getElementById("messagesView");
    const notificationsView = document.getElementById("notificationsView");
    const profPosts = document.getElementById("profPosts");
    const chatWrap = document.getElementById("chatWrap");

    const chatBodyEl = document.getElementById("chatBody");
    let chatPinned = true;
    chatBodyEl.addEventListener("scroll", () => {
      chatPinned = chatBodyEl.scrollHeight - chatBodyEl.scrollTop - chatBodyEl.clientHeight < 60;
    });
    new ResizeObserver(() => {
      if (chatWrap.classList.contains("open") && chatPinned) {
        chatBodyEl.scrollTop = chatBodyEl.scrollHeight;
      }
    }).observe(chatBodyEl);
    function scrollChatToBottom() {
      chatPinned = true;
      requestAnimationFrame(() => {
        chatBodyEl.scrollTop = chatBodyEl.scrollHeight;
      });
    }

    function showView(name) {
      activeView = name;
      feedView.style.display = name === "feed" ? "block" : "none";
      profileView.style.display = name === "profile" ? "block" : "none";
      searchView.style.display = name === "search" ? "block" : "none";
      messagesView.style.display = name === "messages" ? "block" : "none";
      notificationsView.style.display = name === "notifications" ? "block" : "none";
    }

    function updateSidebar() {
      const nameEl = document.getElementById("userName");
      const logoutBtn = document.getElementById("logoutBtn");
      const avatarImg = document.querySelector("#myAvatar img");
      const myAvatar = document.getElementById("myAvatar");
      if (auth && auth.currentUser) {
        nameEl.textContent = myUsername || "you";
        avatarImg.src = myEmoji;
        logoutBtn.style.display = "block";
        myAvatar.dataset.uid = auth.currentUser.uid;
      } else {
        nameEl.textContent = "sign in";
        avatarImg.src = DEFAULT_FACE;
        logoutBtn.style.display = "none";
        delete myAvatar.dataset.uid;
        const b = myAvatar.querySelector(".status-badge");
        if (b) b.remove();
      }
      decorateAvatars(document.querySelector(".sidebar"));
    }

    function fallbackName(user) { return user.email ? user.email.split("@")[0] : "you"; }

    function validUsername(u) {
      return /^[a-zA-Z0-9]{3,13}$/.test(u);
    }

    function killCommentListeners() {
      commentUnsubs.forEach(u => { try { u(); } catch (e) {} });
      commentUnsubs = [];
    }

    function setNotifBadge(n) {
      const b = document.getElementById("notifBadge");
      if (!b) return;
      if (n <= 0) { b.style.display = "none"; b.textContent = ""; return; }
      b.textContent = n > 9 ? "9+" : String(n);
      b.style.display = "flex";
    }
    function setupNotifListener(user) {
      if (notifUnsub) { notifUnsub(); notifUnsub = null; }
      if (!user || !db) { setNotifBadge(0); prevUnreadCount = 0; return; }
      notifUnsub = db.collection("notifications")
        .where("targetUid", "==", user.uid)
        .onSnapshot(snap => {
          let n = 0;
          snap.forEach(d => { if (!d.data().read) n++; });
          if (n > prevUnreadCount) playNotifSound();
          prevUnreadCount = n;
          setNotifBadge(n);
        }, () => {});
    }

    async function fuzzUser() {
      if (auth && auth.currentUser) await auth.signOut();
      myUsername = ""; myEmoji = DEFAULT_FACE; myBio = ""; myStatus = null;
      myFollowing = new Set(); myFollowers = new Set();
      updateSidebar();
      closeProfile();
      showView("feed");
      renderPosts();
      fuzzedModal.classList.add("open");
    }

    async function loadProfile(user) {
      if (!myUsername) { myUsername = fallbackName(user); updateSidebar(); }
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        if (snap.exists) {
          myUsername = snap.data().username || fallbackName(user);
          myEmoji = snap.data().emoji || faceForUid(user.uid);
          myBio = snap.data().bio || "";
          myStatus = snap.data().status || null;
          cacheUser(user.uid, snap.data());
          if (!snap.data().emoji) await db.collection("users").doc(user.uid).update({ emoji: myEmoji });
        } else {
          myUsername = fallbackName(user);
          myEmoji = faceForUid(user.uid);
          await db.collection("users").doc(user.uid).set({
            username: myUsername, emoji: myEmoji, bio: "",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        touchLastSeen();
        updateSidebar();
        if (!validUsername(myUsername)) {
          await fuzzUser();
          return;
        }
        status("Signed in as " + myUsername + " — hi there boyo");
      } catch (err) {
        if (err.code === "permission-denied") {
          status("BLOCKED: Firebase won't let you save your profile. Fix your Firestore rules.", true);
        } else {
          status("Signed in as " + myUsername + " (profile error: " + err.code + ")", true);
        }
      }
    }

    async function notify(targetUid, type, extra) {
      if (!targetUid || !auth || !auth.currentUser) return;
      if (targetUid === auth.currentUser.uid) return;
      try {
        await db.collection("notifications").add({
          targetUid: targetUid, fromUid: auth.currentUser.uid,
          fromUsername: myUsername, fromEmoji: myEmoji, type: type, read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(), ...(extra || {})
        });
      } catch (e) { /* ignore */ }
    }

    if (auth) {
      auth.onAuthStateChanged(user => {
        if (user) {
          loadProfile(user);
          setupNotifListener(user);
          setupUsersListener();
          renderPosts();
        }
        else {
          myUsername = ""; myEmoji = DEFAULT_FACE; myBio = ""; myStatus = null;
          myFollowing = new Set(); myFollowers = new Set();
          killCommentListeners();
          if (chatUnsub) { chatUnsub(); chatUnsub = null; }
          if (usersUnsub) { usersUnsub(); usersUnsub = null; }
          setupNotifListener(null);
          updateSidebar(); closeProfile(); showView("feed"); renderPosts();
        }
      });
    }

    if (db && auth) {
      auth.onAuthStateChanged(user => {
        if (!user) return;
        db.collection("follows").where("followerUid", "==", user.uid)
          .onSnapshot(snap => {
            myFollowing = new Set(snap.docs.map(d => d.data().followeeUid));

            b.classList.toggle("active", (b.dataset.status || null) === (myStatus || null)));
        } else {
          document.getElementById("profAvatar").style.cursor = "default";
          changeBioBtn.style.display = "none";
          followBtn.style.display = "block";
          picker.style.display = "none";
          const following = myFollowing.has(profileUid);
          followBtn.textContent = following ? "Unfollow" : "Follow";
          followBtn.classList.toggle("following", following);
        }
        const [folSnap, follSnap] = await Promise.all([
          db.collection("follows").where("followeeUid", "==", profileUid).get(),
          db.collection("follows").where("followerUid", "==", profileUid).get()
        ]);
        document.getElementById("profFollowers").textContent = folSnap.size;

        document.getElementById("profList").style.display = "none";
        document.getElementById("profPosts").style.display = "block";
        const postsSnap = await db.collection("posts").where("uid", "==", profileUid).get();
        const posts = postsSnap.docs.map(d => ({ id: d.id, data: d.data() }));
        posts.sort((a, b) => (b.data.createdAt ? b.data.createdAt.toMillis() : 0) - (a.data.createdAt ? a.data.createdAt.toMillis() : 0));
        profPosts.innerHTML = "";
        if (posts.length === 0) { profPosts.innerHTML = '<div class="empty">No posts yet.</div>'; return; }
        posts.forEach(p => profPosts.appendChild(buildPost(p.id, p.data, u)));

        profPosts.innerHTML = '<div class="empty">Could not load profile: ' + err.code + "</div>";

    const AVATAR_MAX = 100;
    function findAvatars() {
      return new Promise(resolve => {
        const found = [];
        let pending = AVATAR_MAX;
        for (let i = 1; i <= AVATAR_MAX; i++) {
          const src = "avatar" + i + ".png";
          const img = new Image();
          img.onload = () => { found.push(src); if (--pending === 0) resolve(found); };
          img.onerror = () => { if (--pending === 0) resolve(found); };
          img.src = src;
        }
      });
    }

    function timeAgo(ts) {
      if (!ts) return "now";
      const secs = Math.floor((Date.now() - ts.toMillis()) / 1000);
      if (secs < 60) return "now";
      if (secs < 3600) return Math.floor(secs / 60) + "m";
      if (secs < 86400) return Math.floor(secs / 3600) + "h";
      return Math.floor(secs / 86400) + "d";
    }

    function buildPost(postId, data, userDoc) {
      const article = document.createElement("article");
      article.className = "post";
      const likeCount = data.likes ? Object.keys(data.likes).length : 0;
      const iLiked = auth && auth.currentUser && data.likes && data.likes[auth.currentUser.uid];
      const isMyPost = auth && auth.currentUser && data.uid === auth.currentUser.uid;
      const cachedUser = userCache.get(data.uid);
      const emoji = (cachedUser && cachedUser.emoji) || (userDoc && userDoc.emoji) || data.emoji || faceForUid(data.uid);
      const name = (cachedUser && cachedUser.username) || data.username || (userDoc && userDoc.username) || "user";
      const postUid = data.uid;
      article.innerHTML =
        '<div class="post-head">' +
          '<div class="avatar" data-uid="' + postUid + '"><img src="' + emoji + '" alt="" /></div>' +
          '<span class="p-name" data-uid="' + postUid + '"></span>' + verifiedBadge(name) +
          ' <span class="time">| ' + timeAgo(data.createdAt) + "</span>" +
        "</div>" +
        '<div class="post-body"></div>' +
        '<div class="post-actions">' +
          '<button class="action like ' + (iLiked ? "active" : "") + '">' + HEART_SVG + ' <span class="count">' + likeCount + "</span></button>" +
          '<button class="action comment-toggle"><img src="' + COMMENT + '" alt="comment" /> <span class="count">' + (data.commentCount || 0) + "</span></button>" +
          (isMyPost ? '<button class="action del-post" title="Delete post"><img src="' + TRASH + '" alt="delete" /></button>' : "") +
        "</div>" +
        '<div class="comments" style="display:none">' +
          '<div class="comment-list"></div>' +
          '<div class="reply-chip"></div>' +
          '<div class="comment-row">' +
            '<input type="text" placeholder="Write a comment..." />' +
            '<button class="btn btn-primary send-comment">Send</button>' +
          "</div>" +
        "</div>";
      article.querySelector(".p-name").textContent = name;
      setEmojiText(article.querySelector(".post-body"), data.text);
      article.querySelector(".p-name").addEventListener("click", () => openProfile(postUid));
      article.querySelector(".post-head .avatar").addEventListener("click", () => openProfile(postUid));
      article.querySelector(".like").addEventListener("click", async function() {
        if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
        const uid = auth.currentUser.uid;
        const liked = this.classList.contains("active");
        this.classList.toggle("active", !liked);
        const newLikes = { ...(data.likes || {}) };
        if (liked) delete newLikes[uid]; else newLikes[uid] = true;
        try {
          await db.collection("posts").doc(postId).update({ likes: newLikes });
          if (!liked && postUid !== uid) notify(postUid, "like_post", { postId: postId });
        } catch (err) { toast("Like failed: " + err.code, true); }
      });
      article.querySelector(".comment-toggle").addEventListener("click", function() {
        const c = this.closest(".post").querySelector(".comments");
        c.style.display = c.style.display === "none" ? "block" : "none";
      });
      if (isMyPost) {
        article.querySelector(".del-post").addEventListener("click", () => {
          showConfirm("Delete this post?", "This cannot be undone.", async () => {
            try {
              const cSnap = await db.collection("posts").doc(postId).collection("comments").get();
              if (cSnap.size) {
                const batch = db.batch();
                cSnap.forEach(c => batch.delete(c.ref));
                await batch.commit();
              }
              await db.collection("posts").doc(postId).delete();
              status("Post deleted.");
            } catch (err) { toast("Delete failed: " + err.code, true); }
          });
        });
      }
      let replyTarget = null;
      const chip = article.querySelector(".reply-chip");
      const cInput = article.querySelector(".comment-row input");
      function setReply(t) {
        replyTarget = t;
        if (t) {
          chip.style.display = "flex";
          chip.innerHTML = "Replying to <b></b> <span class='cancel'>✕</span>";
          chip.querySelector("b").textContent = t.username;
          chip.querySelector(".cancel").addEventListener("click", () => setReply(null));
          cInput.placeholder = "Write a reply...";
          cInput.focus();
        } else {
          chip.style.display = "none";
          cInput.placeholder = "Write a comment...";
        }
      }
      function buildCommentEl(c, depth) {
        const cd = c.data;
        const liked = auth && auth.currentUser && cd.likes && cd.likes[auth.currentUser.uid];
        const likeCount = cd.likes ? Object.keys(cd.likes).length : 0;
        const isMine = auth && auth.currentUser && cd.uid === auth.currentUser.uid;
        const item = document.createElement("div");
        item.className = "comment-item" + (depth > 0 ? " nested" : "");
        item.style.marginLeft = (Math.min(depth, 3) * 24) + "px";
        const cachedC = userCache.get(cd.uid);
        item.innerHTML =
          '<div class="avatar" data-uid="' + cd.uid + '"><img src="' + ((cachedC && cachedC.emoji) || cd.emoji || faceForUid(cd.uid)) + '" alt="" /></div>' +
          '<div class="c-body">' +
            '<div class="c-head"><b></b>' + verifiedBadge(cd.username) + '<span class="time">' + timeAgo(cd.createdAt) + "</span></div>" +
            '<div class="c-text"></div>' +
            '<div class="c-actions">' +
              '<button class="c-like ' + (liked ? "active" : "") + '">' + HEART_SVG + ' <span>' + likeCount + "</span></button>" +
              '<button class="c-reply">Reply</button>' +
              (isMine ? '<button class="c-del" title="Delete comment">✕</button>' : "") +
            "</div>" +
          "</div>";
        item.querySelector("b").textContent = cd.username;
        item.querySelector("b").addEventListener("click", () => openProfile(cd.uid));
        item.querySelector(".avatar").addEventListener("click", () => openProfile(cd.uid));
        setEmojiText(item.querySelector(".c-text"), cd.text);
        item.querySelector(".c-like").addEventListener("click", async function() {
          if (!auth || !auth.currentUser) { toast("Log in first.", true); return; }
          const uid = auth.currentUser.uid;
          const newLikes = { ...(cd.likes || {}) };
          const wasLiked = !!newLikes[uid];
          this.classList.toggle("active", !wasLiked);
          if (newLikes[uid]) delete newLikes[uid]; else newLikes[uid] = true;
          try {
            await db.collection("posts").doc(postId).collection("comments").doc(c.id).update({ likes: newLikes });
            if (!wasLiked && cd.uid !== uid) notify(cd.uid, "like_comment", { postId: postId, commentId: c.id });
          } catch (err) { toast("Like failed: " + err.code, true); }
        });
        item.querySelector(".c-reply").addEventListener("click", () => setReply({ id: c.id, uid: cd.uid, username: cd.username }));
        if (isMine) {
          item.querySelector(".c-del").addEventListener("click", () => {
            showConfirm("Delete this comment?", "This cannot be undone.", async () => {
              try {
                await db.collection("posts").doc(postId).collection("comments").doc(c.id).delete();
                await db.collection("posts").doc(postId).update({ commentCount: firebase.firestore.FieldValue.increment(-1) });
              } catch (err) { toast("Delete failed: " + err.code, true); }
            });
          });
        }
        return item;
      }
      article.querySelector(".send-comment").addEventListener("click", async function() {
        if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
        const text = cInput.value.trim();
        if (!text) return;
        const rt = replyTarget;
        try {
          await db.collection("posts").doc(postId).collection("comments").add({
            uid: auth.currentUser.uid, username: myUsername, emoji: myEmoji, text: text, likes: {},
            parentId: rt ? rt.id : null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await db.collection("posts").doc(postId).update({ commentCount: firebase.firestore.FieldValue.increment(1) });
          cInput.value = "";
          setReply(null);
          if (rt) { if (rt.uid !== auth.currentUser.uid) notify(rt.uid, "reply", { postId: postId }); }
          else { if (postUid !== auth.currentUser.uid) notify(postUid, "comment", { postId: postId }); }
        } catch (err) {
          if (err.code === "permission-denied") toast("Comment blocked: fix your Firestore rules.", true);
          else toast("Comment failed: " + err.code, true);
        }
      });
      if (auth && auth.currentUser) {
        const unsub = db.collection("posts").doc(postId).collection("comments")
          .orderBy("createdAt", "asc")
          .onSnapshot(snap => {
            const list = article.querySelector(".comment-list");
            list.innerHTML = "";
            const all = [];
            snap.forEach(c => all.push({ id: c.id, data: c.data() }));
            const topLevel = all.filter(c => !c.data.parentId);
            const childrenOf = (id) => all.filter(c => c.data.parentId === id);
            function renderTree(c, depth) {
              list.appendChild(buildCommentEl(c, depth));
              childrenOf(c.id).forEach(ch => renderTree(ch, depth + 1));
            }
            topLevel.forEach(c => renderTree(c, 0));
            decorateAvatars(article);
            article.querySelector(".comment-toggle .count").textContent = snap.size;
          }, err => {
            if (!auth || !auth.currentUser) return;
            toast("Comments error: " + err.code, true);
          });
        commentUnsubs.push(unsub);
      }
      return article;
    }

    function renderPosts() {
      killCommentListeners();
      postsList.innerHTML = "";
      if (!db) { postsList.innerHTML = '<div class="empty">Firebase not loaded.</div>'; return; }
      const cutoff = Date.now() - POST_TTL;
      let posts = lastPosts.filter(p => {
        const ts = p.data().createdAt;
        return ts && ts.toMillis() >= cutoff;
      });
      if (activeTab === "following") posts = posts.filter(p => myFollowing.has(p.data().uid));
      if (posts.length === 0) {
        postsList.innerHTML = '<div class="empty">' +
          (activeTab === "following" ? "Follow some people and their posts will show up here." : "No recent posts — be the first to post!") + "</div>";
        return;
      }
      posts.forEach(p => postsList.appendChild(buildPost(p.id, p.data(), null)));
      decorateAvatars(postsList);
    }

    if (db) {
      db.collection("posts").orderBy("createdAt", "desc")
        .onSnapshot(snap => {
          lastPosts = snap.docs;
          renderPosts();
          if (activeView === "search") renderSearch(document.getElementById("searchInput").value);
        }, err => {
          if (!auth || !auth.currentUser) return;
          toast("Posts error: " + err.code, true);
        });
    }

    document.querySelectorAll("#feedView .tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("#feedView .tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeTab = tab.dataset.tab;
        renderPosts();
      });
    });

    document.querySelectorAll(".stab").forEach(stab => {
      stab.addEventListener("click", () => {
        document.querySelectorAll(".stab").forEach(s => s.classList.remove("active"));
        stab.classList.add("active");
        searchMode = stab.dataset.stab;
        renderSearch(document.getElementById("searchInput").value);
      });
    });
    document.getElementById("searchInput").addEventListener("input", function() { renderSearch(this.value); });

    function renderSearch(raw) {
      const box = document.getElementById("searchResults");
      box.innerHTML = "";
      if (!db) return;
      const q = (raw || "").trim().toLowerCase();
      if (!q) { box.innerHTML = '<div class="empty">Type to search ' + (searchMode === "posts" ? "posts" : "accounts") + ".</div>"; return; }
      if (searchMode === "posts") {
        const posts = lastPosts.filter(p => (p.data().text || "").toLowerCase().includes(q));
        if (posts.length === 0) { box.innerHTML = '<div class="empty">No posts match "' + q + '".</div>'; return; }
        posts.forEach(p => box.appendChild(buildPost(p.id, p.data(), null)));
        decorateAvatars(box);
      } else {
        db.collection("users").get().then(snap => {
          const users = snap.docs.map(d => ({ id: d.id, data: d.data() }))
            .filter(u => (u.data.username || "").toLowerCase().includes(q));
          if (users.length === 0) { box.innerHTML = '<div class="empty">No accounts match "' + q + '".</div>'; return; }
          const me = auth && auth.currentUser ? auth.currentUser.uid : null;
          users.forEach(u => {
            cacheUser(u.id, u.data);
            const row = document.createElement("div");
            row.className = "list-row";
            row.innerHTML =
              '<div class="avatar" data-uid="' + u.id + '"><img src="' + (u.data.emoji || faceForUid(u.id)) + '" alt="" /></div>' +
              '<span class="l-name"></span><span class="l-handle">@' + (u.data.username || "user") + "</span>";
            row.querySelector(".l-name").textContent = u.data.username || "user";
            row.querySelector(".l-name").insertAdjacentHTML("beforeend", verifiedBadge(u.data.username));
            row.addEventListener("click", () => openProfile(u.id));
            if (u.id !== me) {
              const btn = document.createElement("button");
              btn.className = "follow-btn" + (myFollowing.has(u.id) ? " following" : "");
              btn.textContent = myFollowing.has(u.id) ? "Unfollow" : "Follow";
              btn.addEventListener("click", async e => {
                e.stopPropagation();
                if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
                const ref = db.collection("follows").doc(auth.currentUser.uid + "_" + u.id);
                try {
                  const fs = await ref.get();
                  if (fs.exists) { await ref.delete(); status("Unfollowed."); }
                  else { await ref.set({ followerUid: auth.currentUser.uid, followeeUid: u.id }); status("Following."); notify(u.id, "follow"); }
                  renderSearch(document.getElementById("searchInput").value);
                } catch (err) { status("Follow failed: " + err.code, true); }
              });
              row.appendChild(btn);
            }
            box.appendChild(row);
          });
          decorateAvatars(box);
        });
      }
    }

    function notifText(d) {
      const name = d.fromUsername || "Someone";
      switch (d.type) {
        case "follow": return name + " followed you";
        case "like_post": return name + " liked your post";
        case "comment": return name + " commented on your post";
        case "like_comment": return name + " liked your reply";
        case "reply": return name + " replied to your comment";
        case "dm": return name + " sent you a message";
        default: return name + " did something";
      }
    }

    async function renderNotifications() {
      const list = document.getElementById("notifList");
      if (!auth || !auth.currentUser) { list.innerHTML = '<div class="empty">Log in to see notifications.</div>'; return; }
      const me = auth.currentUser.uid;
      try {
        const snap = await db.collection("notifications").where("targetUid", "==", me).get();
        const items = snap.docs.map(d => ({ id: d.id, data: d.data() }));
        items.sort((a, b) => (b.data.createdAt ? b.data.createdAt.toMillis() : 0) - (a.data.createdAt ? a.data.createdAt.toMillis() : 0));
        if (items.length === 0) { list.innerHTML = '<div class="empty">No notifications yet.</div>'; return; }
        list.innerHTML = "";
        const batch = db.batch();
        items.forEach(i => {
          const row = document.createElement("div");
          row.className = "notif-item" + (i.data.read ? "" : " unread");
          row.innerHTML = '<div class="avatar" data-uid="' + i.data.fromUid + '"><img src="' + (i.data.fromEmoji || faceForUid(i.data.fromUid)) + '" alt="" /></div><div class="n-body"><div class="n-text"></div><div class="n-time">' + timeAgo(i.data.createdAt) + "</div></div>";
          row.querySelector(".n-text").textContent = notifText(i.data);
          row.addEventListener("click", () => {
            if (i.data.type === "dm") {
              db.collection("users").doc(i.data.fromUid).get().then(s => {
                if (!s.exists) { openProfile(i.data.fromUid); return; }
                showView("messages");
                openChat(s.id, s.data());
              });
            } else {
              openProfile(i.data.fromUid);
            }
          });
          list.appendChild(row);
          if (!i.data.read) batch.update(db.collection("notifications").doc(i.id), { read: true });
        });
        batch.commit();
        decorateAvatars(list);
        setNotifBadge(0);
      } catch (err) { toast("Notifications error: " + err.code, true); }
    }

    function renderConversations() {
      document.getElementById("msgListWrap").style.display = "block";
      chatWrap.classList.remove("open");
      delete chatWrap.dataset.uid;
      activeChatUid = null;
      if (chatUnsub) { chatUnsub(); chatUnsub = null; }
      const list = document.getElementById("msgList");
      if (!auth || !auth.currentUser) { list.innerHTML = '<div class="empty">Log in to see your messages.</div>'; return; }
      const mutuals = [...myFollowing].filter(u => myFollowers.has(u));
      if (mutuals.length === 0) {
        list.innerHTML = '<div class="empty">No conversations yet.<br>Follow someone who follows you back to start a DM.</div>';
        return;
      }
      Promise.all(mutuals.map(u => db.collection("users").doc(u).get())).then(snaps => {
        list.innerHTML = "";
        snaps.forEach(s => {
          if (!s.exists) return;
          const u = s.data();
          cacheUser(s.id, u);
          const row = document.createElement("div");
          row.className = "msg-convo";
          row.innerHTML = '<div class="avatar" data-uid="' + s.id + '"><img src="' + (u.emoji || faceForUid(s.id)) + '" alt="" /></div><span class="m-name"></span>';
          row.querySelector(".m-name").textContent = u.username;
          row.querySelector(".m-name").insertAdjacentHTML("beforeend", verifiedBadge(u.username));
          row.addEventListener("click", () => openChat(s.id, u));
          list.appendChild(row);
        });
        decorateAvatars(list);
      });
    }

    function msgTime(ts) {
      if (!ts) return "";
      const d = new Date(ts.toMillis());
      const now = new Date();
      const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      if (d.toDateString() === now.toDateString()) return timeStr;
      return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + timeStr;
    }

    function tickStatus(msg, partnerUid) {
      if (msg.readBy && msg.readBy[partnerUid]) return "read";
      if (isOnline(partnerUid)) return "delivered";
      return "sent";
    }
    function updateChatTicks() {
      const partnerUid = chatWrap.dataset.uid;
      if (!partnerUid) return;
      currentChatMsgs.forEach(m => {
        if (m.data.uid !== auth.currentUser.uid) return;
        const el = document.querySelector('.msg-ticks[data-mid="' + m.id + '"]');
        if (!el) return;
        const st = tickStatus(m.data, partnerUid);
        el.textContent = st === "read" ? "✓✓" : (st === "delivered" ? "✓✓" : "✓");
        el.classList.toggle("read", st === "read");
      });
    }

    function drawChatMessages(snap, me) {
      const body = document.getElementById("chatBody");
      body.innerHTML = "";
      const msgs = [];
      snap.forEach(m => msgs.push({ id: m.id, data: m.data() }));
      msgs.sort((a, b) => a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
      currentChatMsgs = msgs;
      if (msgs.length === 0) {
        body.innerHTML = '<div class="empty">Say hi <img class="tw-emoji" src="' + WAVE + '" alt="" /></div>';
        return;
      }
      const partnerUid = chatWrap.dataset.uid;
      msgs.forEach(m => {
        const d = m.data;
        const mine = d.uid === me;
        const wrap = document.createElement("div");
        wrap.className = "msg-wrap " + (mine ? "me" : "them");
        const bubble = document.createElement("div");
        bubble.className = "chat-msg " + (mine ? "me" : "them");
        bubble.innerHTML = twEmojiHtml(d.text);
        wrap.appendChild(bubble);
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = msgTime(d.createdAt);
        meta.appendChild(time);
        if (mine && partnerUid) {
          const ticks = document.createElement("span");
          ticks.className = "msg-ticks";
          ticks.dataset.mid = m.id;
          const st = tickStatus(d, partnerUid);
          ticks.textContent = st === "read" ? "✓✓" : (st === "delivered" ? "✓✓" : "✓");
          if (st === "read") ticks.classList.add("read");
          meta.appendChild(ticks);
          const del = document.createElement("button");
          del.className = "msg-del";
          del.textContent = "\u2715";
          del.title = "Delete message";
          del.addEventListener("click", () => {
            showConfirm("Delete this message?", "This cannot be undone.", async () => {
              try {
                await db.collection("dms").doc([me, partnerUid].sort().join("_")).collection("messages").doc(m.id).delete();
              } catch (err) { toast("Delete failed: " + err.code, true); }
            });
          });
          meta.appendChild(del);
        }
        wrap.appendChild(meta);
        body.appendChild(wrap);
      });
      scrollChatToBottom();
    }

    function openChat(uid, userDoc) {
      if (!uid || uid === "undefined") { toast("Could not open chat — no valid user.", true); return; }
      activeChatUid = uid;
      chatWrap.dataset.uid = uid;
      document.getElementById("msgListWrap").style.display = "none";
      chatWrap.classList.add("open");
      cacheUser(uid, userDoc);
      const chatName = document.getElementById("chatName");
      chatName.textContent = userDoc.username;
      chatName.insertAdjacentHTML("beforeend", verifiedBadge(userDoc.username));
      const chatAvatar = document.getElementById("chatAvatar");
      chatAvatar.dataset.uid = uid;
      document.querySelector("#chatAvatar img").src = userDoc.emoji || faceForUid(uid);
      decorateAvatars(chatWrap);
      const me = auth.currentUser.uid;
      const dmId = [me, uid].sort().join("_");
      if (chatUnsub) chatUnsub();
      chatUnsub = db.collection("dms").doc(dmId).collection("messages")
        .onSnapshot(snap => {
          drawChatMessages(snap, me);
          const msgs = [];
          snap.forEach(m => msgs.push({ id: m.id, data: m.data() }));
          const toMark = msgs.filter(m => m.data.uid === uid && !(m.data.readBy && m.data.readBy[me]));
          if (toMark.length) {
            const batch = db.batch();
            toMark.forEach(m => {
              const rb = { ...(m.data.readBy || {}) };
              rb[me] = true;
              batch.update(db.collection("dms").doc(dmId).collection("messages").doc(m.id), { readBy: rb });
            });
            batch.commit().catch(() => {});
          }
        }, err => {
          if (!auth || !auth.currentUser) return;
          toast("Messages error: " + (err.code || err.message) +
            (err.code === "permission-denied" ? " — fix your Firestore rules" : ""), true);
        });
      scrollChatToBottom();
      document.getElementById("chatInput").focus();
    }

    document.getElementById("chatBack").addEventListener("click", renderConversations);
    document.getElementById("chatName").addEventListener("click", () => { if (activeChatUid) openProfile(activeChatUid); });
    document.getElementById("chatAvatar").addEventListener("click", () => { if (activeChatUid) openProfile(activeChatUid); });

    async function sendChat() {
      if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
      const partnerUid = chatWrap.dataset.uid || activeChatUid;
      if (!partnerUid || partnerUid === "undefined") { toast("No conversation open — click a friend in the list first.", true); return; }
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) { toast("Type something first bro.", true); return; }
      const me = auth.currentUser.uid;
      const dmId = [me, partnerUid].sort().join("_");
      try {
        await db.collection("dms").doc(dmId).collection("messages").add({
          uid: me, username: myUsername, emoji: myEmoji, text: text,
          readBy: {},
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
        notify(partnerUid, "dm", {});
        scrollChatToBottom();
      } catch (err) {
        if (err.code === "permission-denied") toast("DM blocked: your Firestore rules don't allow logged-in users to write. Fix the rules.", true);
        else toast("Message failed: " + err.code, true);
      }
    }
    document.getElementById("chatSend").addEventListener("click", sendChat);
    document.getElementById("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

    document.querySelectorAll(".nav-item").forEach(item => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
        item.classList.add("active");
        const nav = item.dataset.nav;
        if (nav === "home") goHome();
        else if (nav === "search") { showView("search"); renderSearch(document.getElementById("searchInput").value); document.getElementById("searchInput").focus(); }
        else if (nav === "account") {
          if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
          openProfile(auth.currentUser.uid);
        }
        else if (nav === "notifications") {
          if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
          showView("notifications");
          renderNotifications();
        }
        else if (nav === "messages") {
          if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
          showView("messages");
          renderConversations();
        }
      });
    });

    document.getElementById("messagesBtn").addEventListener("click", () => {
      if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
      document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
      showView("messages");
      renderConversations();
    });

    const modal = document.getElementById("postModal");
    document.getElementById("openPost").addEventListener("click", () => {
      if (!auth || !auth.currentUser) { toast("Log in first — click your name in the sidebar.", true); return; }
      modal.classList.add("open");
      document.getElementById("postText").focus();
    });
    document.getElementById("cancelPost").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

    document.getElementById("submitPost").addEventListener("click", async () => {
      if (!auth || !auth.currentUser) return;
      const text = document.getElementById("postText").value.trim();
      if (!text) return;
      status("Posting...");
      try {
        await db.collection("posts").add({
          text: text, uid: auth.currentUser.uid, username: myUsername, emoji: myEmoji,
          likes: {}, commentCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById("postText").value = "";
        modal.classList.remove("open");
        status("Post published.");
      } catch (err) {
        if (err.code === "permission-denied") status("Post blocked: fix your Firestore rules.", true);
        else status("Post failed: " + err.code, true);
      }
    });

    const confirmModal = document.getElementById("confirmModal");
    let confirmOkCb = null;
    function showConfirm(title, msg, onOk) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMsg").textContent = msg;
      confirmOkCb = onOk;
      confirmModal.classList.add("open");
    }
    document.getElementById("confirmCancel").addEventListener("click", () => {
      confirmModal.classList.remove("open");
      confirmOkCb = null;
    });
    document.getElementById("confirmOk").addEventListener("click", () => {
      const cb = confirmOkCb;
      confirmModal.classList.remove("open");
      confirmOkCb = null;
      if (cb) cb();
    });
    confirmModal.addEventListener("click", e => {
      if (e.target === confirmModal) { confirmModal.classList.remove("open"); confirmOkCb = null; }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && confirmModal.classList.contains("open")) {
        confirmModal.classList.remove("open");
        confirmOkCb = null;
      }
    });
  </script>
</body>
</html>
